name: probe
on:
  push:
    branches: [claude/project-thread-0quoim-speed-probe]
defaults:
  run:
    shell: bash
jobs:
  libs:
    strategy:
      fail-fast: false
      matrix:
        tmp: [default, d]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
        with:
          repository: jatassi/SlipStream
          ref: feature/release-build-ci
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - run: |
          /c/msys64/usr/bin/pacman -S --noconfirm --needed make perl
          echo 'C:\msys64\usr\bin' >> "$GITHUB_PATH"
      - if: matrix.tmp == 'd'
        run: |
          mkdir -p "$RUNNER_TEMP/tmp"
          echo "TMP=$RUNNER_TEMP\\tmp" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP\\tmp" >> "$GITHUB_ENV"
          echo "LOCALAPPDATA=$RUNNER_TEMP\\appdata" >> "$GITHUB_ENV"
      - run: go run ./cmd/release deps build -kind libs -target windows-amd64 -archive "$RUNNER_TEMP/libs.tar.gz" 2>&1 | grep -E "^\[[0-9]+/[0-9]+\]" | while IFS= read -r l; do echo "$(date +%T) $l"; done
