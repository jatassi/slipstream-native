name: probe
on:
  push:
    branches: ["claude/**"]
jobs:
  ubuntu:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - run: which ninja make perl cmake; cmake --version | head -1
  macos:
    runs-on: macos-15
    steps:
      - run: |
          set -x
          xcode-select -p; xcodebuild -version; ls /Applications | grep -i xcode
          clang --version; cmake --version; which ninja make perl || true; perl -v | head -2; sysctl -n hw.ncpu
          arch -x86_64 /usr/bin/true && echo ROSETTA_OK || echo ROSETTA_MISSING
          /usr/bin/pgrep -q oahd && echo oahd running || echo no oahd
          xcrun --show-sdk-version; xcrun --show-sdk-path
          ifconfig lo0
          sysctl -n machdep.cpu.brand_string
          cat > /tmp/t.c <<'C'
          int main(void){return 0;}
          C
          clang -arch x86_64 -mmacosx-version-min=13.0 /tmp/t.c -o /tmp/t && /tmp/t && echo RAN_X86_64
          go version || true
