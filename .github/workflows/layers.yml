name: layers

on:
  workflow_dispatch:
    inputs:
      ref:
        description: SlipStream branch or SHA whose native inputs and recipe to build
        required: true

permissions:
  contents: read

env:
  REF: ${{ inputs.ref }}

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      toolchain: ${{ steps.missing.outputs.toolchain }}
      libs: ${{ steps.missing.outputs.libs }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: jatassi/SlipStream
          ref: ${{ env.REF }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - id: missing
        run: |
          missing=$(go run ./cmd/release deps missing)
          for kind in toolchain libs; do
            echo "$kind=$(echo "$missing" | jq -c ".$kind")" >> "$GITHUB_OUTPUT"
          done

  toolchain:
    needs: plan
    if: fromJSON(needs.plan.outputs.toolchain).include[0] != null
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.toolchain) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: jatassi/SlipStream
          ref: ${{ env.REF }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go run ./cmd/release deps build -kind toolchain -target ${{ matrix.target }} -archive "$RUNNER_TEMP/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ runner.temp }}/${{ matrix.asset }}
          if-no-files-found: error
          compression-level: 0

  publish-toolchain:
    needs: [plan, toolchain]
    if: ${{ !cancelled() && needs.toolchain.result != 'skipped' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      MATRIX: ${{ needs.plan.outputs.toolchain }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: toolchain-*
          path: assets
          merge-multiple: true
      - run: .github/publish-layers.sh

  libs:
    needs: [plan, publish-toolchain]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.publish-toolchain.result != 'failure' && fromJSON(needs.plan.outputs.libs).include[0] != null }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.libs) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: jatassi/SlipStream
          ref: ${{ env.REF }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - if: matrix.xcode
        run: echo "DEVELOPER_DIR=/Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer" >> "$GITHUB_ENV"
      # OpenSSL builds for MinGW only with an MSYS2 perl and make.
      - if: runner.os == 'Windows'
        run: |
          /c/msys64/usr/bin/pacman -S --noconfirm --needed make perl
          echo 'C:\msys64\usr\bin' >> "$GITHUB_PATH"
      - run: go run ./cmd/release deps build -kind libs -target ${{ matrix.target }} -archive "$RUNNER_TEMP/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ runner.temp }}/${{ matrix.asset }}
          if-no-files-found: error
          compression-level: 0

  publish-libs:
    needs: [plan, libs]
    if: ${{ !cancelled() && needs.libs.result != 'skipped' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      MATRIX: ${{ needs.plan.outputs.libs }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: libs-*
          path: assets
          merge-multiple: true
      - run: .github/publish-layers.sh
